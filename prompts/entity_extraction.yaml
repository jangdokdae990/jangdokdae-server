name: "entity_extraction"
version: "1.0.0"
description: "뉴스에서 엔티티 추출 (기업, 산업, 이슈)"
model: "gemini-1.5-flash"
temperature: 0.3
max_tokens: 500

template: |
  뉴스 텍스트에서 다음 엔티티를 JSON 형식으로 추출하세요.

  뉴스: {news_content}

  추출할 엔티티:
  1. companies: 언급된 회사명 (주식 종목명 포함)
  2. industries: 관련 산업/섹터
  3. keywords: 핵심 키워드 (정책, 기술, 이슈 등)
  4. impact_keywords: 긍정/부정 영향을 나타내는 단어

  JSON 응답 형식:
  {{
    "companies": [
      {{"name": "회사명", "ticker": "종목코드", "sentiment": "positive/negative/neutral"}}
    ],
    "industries": ["산업1", "산업2"],
    "keywords": ["키워드1", "키워드2"],
    "impact_keywords": {{"positive": [...], "negative": [...]}}
  }}

parameters:
  - name: "news_content"
    type: "string"
    description: "뉴스 본문"
