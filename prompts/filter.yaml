name: "filter"
version: "1.0.0"
description: "주식 투자자에게 중요한 뉴스인지 판단"
model: "gemini-1.5-flash"
temperature: 0.3
max_tokens: 200

template: |
  다음 뉴스가 주식 투자자에게 중요한 뉴스인지 판단하세요.

  뉴스 제목: {news_title}
  뉴스 요약: {news_summary}

  판단 기준:
  - 특정 종목이나 산업에 직접적인 영향을 미치는가?
  - 시장 흐름을 이해하는데 필요한 정보인가?
  - 투자 결정에 영향을 줄 수 있는 정보인가?
  - 신뢰할 수 있는 소스인가?

  JSON 응답:
  {{
    "is_important": true|false,
    "confidence": 0.0-1.0,
    "reason": "판단 이유"
  }}

parameters:
  - name: "news_title"
    type: "string"
  - name: "news_summary"
    type: "string"
